name: ClipShortener Processor

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - clipshortener-process

jobs:

  b2-auth-test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify B2 credentials
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}

        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          key_id = os.environ.get("B2_KEY_ID", "")
          app_key = os.environ.get("B2_APPLICATION_KEY", "")
          bucket = os.environ.get("B2_BUCKET", "")

          def shape(value):
              return {
                  "length": len(value),
                  "trimmed_length": len(value.strip()),
                  "has_outer_whitespace": value != value.strip(),
                  "fingerprint": hashlib.sha256(
                      value.encode("utf-8")
                  ).hexdigest()[:12],
              }

          print("KEY_ID:", json.dumps(shape(key_id)))
          print("APPLICATION_KEY:", json.dumps(shape(app_key)))
          print("BUCKET:", bucket)

          if not key_id:
              raise SystemExit("B2_KEY_ID is EMPTY in GitHub Actions.")

          if not app_key:
              raise SystemExit(
                  "B2_APPLICATION_KEY is EMPTY in GitHub Actions."
              )

          if not bucket:
              raise SystemExit("B2_BUCKET is EMPTY in GitHub Actions.")

          def authorize(label, kid, key):
              raw = f"{kid}:{key}".encode("utf-8")
              basic = base64.b64encode(raw).decode("ascii")

              req = urllib.request.Request(
                  "https://api.backblazeb2.com/b2api/v4/b2_authorize_account",
                  method="GET",
                  headers={
                      "Authorization": f"Basic {basic}",
                      "Accept": "application/json",
                      "User-Agent": "ClipShortener-B2-Diagnostic/1.0",
                  },
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(
                          response.read().decode("utf-8")
                      )

                      storage = (
                          data.get("apiInfo", {})
                          .get("storageApi", {})
                      )

                      allowed = (
                          storage.get("allowed", {})
                          .get("buckets", [])
                      )

                      bucket_found = any(
                          item.get("name") == bucket
                          for item in allowed
                      )

                      print(f"B2_TEST_{label}=SUCCESS")
                      print("HTTP:", response.status)
                      print(
                          "STORAGE_API:",
                          bool(storage)
                      )
                      print(
                          "BUCKET_VISIBLE:",
                          bucket_found
                      )

                      return True

              except urllib.error.HTTPError as error:
                  body = error.read().decode(
                      "utf-8",
                      "replace"
                  )

                  print(f"B2_TEST_{label}=FAILED")
                  print("HTTP:", error.code)
                  print("BODY:", body)

                  return False

          raw_ok = authorize(
              "RAW",
              key_id,
              app_key
          )

          if raw_ok:
              print("FINAL_RESULT=B2_AUTHENTICATION_SUCCESS")
              raise SystemExit(0)

          trimmed_ok = authorize(
              "TRIMMED",
              key_id.strip(),
              app_key.strip()
          )

          if trimmed_ok:
              raise SystemExit(
                  "FINAL_RESULT=SECRET_WHITESPACE_ERROR"
              )

          raise SystemExit(
              "FINAL_RESULT=B2_CREDENTIAL_REJECTED"
          )
          PY


  process:
    if: ${{ github.event_name == 'repository_dispatch' }}

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Check out worker
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-worker.txt

      - name: Run ClipShortener job
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_PAYLOAD: ${{ toJson(github.event.client_payload) }}

          CONTROL_URL: ${{ secrets.CONTROL_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}

          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}

          CLIPSHORTENER_FFMPEG_THREADS: "0"
          CLIPSHORTENER_FILTER_THREADS: "0"
          CLIPSHORTENER_FFMPEG_PRESET: "ultrafast"
          CLIPSHORTENER_FFMPEG_TUNE: ""
          CLIPSHORTENER_X264_PARAMS: ""
          CLIPSHORTENER_UPLOAD_FSYNC: "0"
          CLIPSHORTENER_NO_UPSCALE: "1"
          CLIPSHORTENER_VALIDATE_OUTPUT_DURATIONS: "0"

        run: python process_job.py
