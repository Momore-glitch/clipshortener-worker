name: Reprocess existing ClipShortener source

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Existing 32-character ClipShortener job ID (source already uploaded to B2)'
        required: true
        type: string

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out worker
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Install FFmpeg and Python dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check -r requirements-worker.txt

      - name: Load the already-uploaded job
        env:
          JOB_ID_INPUT: ${{ inputs.job_id }}
          CONTROL_URL: ${{ secrets.CONTROL_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          job_id = os.environ["JOB_ID_INPUT"].strip()
          base = os.environ["CONTROL_URL"].strip().rstrip("/")
          secret = os.environ["WORKER_SECRET"].strip()

          if not re.fullmatch(r"[a-fA-F0-9]{32}", job_id):
              raise SystemExit("JOB_ID must be the existing 32-character hexadecimal job ID.")
          if not base or not secret:
              raise SystemExit("Missing CONTROL_URL or WORKER_SECRET repository secret.")

          request = urllib.request.Request(
              f"{base}/api/jobs/{urllib.parse.quote(job_id, safe='')}",
              headers={"Accept": "application/json", "X-Worker-Secret": secret},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  job = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", "replace")[:800]
              raise SystemExit(f"Could not load existing job: HTTP {error.code}: {detail}")

          if job.get("id") != job_id:
              raise SystemExit("Loaded job ID did not match the requested job ID.")
          if str(job.get("status", "")).lower() != "error":
              raise SystemExit(
                  f"Safety stop: job status is {job.get('status')!r}; "
                  "only failed jobs can be reprocessed by this workflow."
              )

          expected_prefix = f"jobs/{job_id}/source/"
          if not str(job.get("source_key", "")).startswith(expected_prefix):
              raise SystemExit("The job does not contain the expected stored B2 source path.")
          if int(job.get("total_size") or 0) <= 0:
              raise SystemExit("The stored job metadata has no valid source size.")
          if not job.get("filename"):
              raise SystemExit("The stored job metadata has no source filename.")

          payload = json.dumps({"job": job}, separators=(",", ":"))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"JOB_ID={job_id}\n")
              env_file.write(f"JOB_PAYLOAD={payload}\n")

          print("EXISTING_SOURCE_CONFIRMED=YES")
          print("SOURCE_BYTES:", int(job["total_size"]))
          print("SOURCE_FILENAME:", job["filename"])
          print("No new upload will be created.")
          PY

      - name: Reprocess using retryable byte-range downloads
        timeout-minutes: 80
        env:
          CONTROL_URL: ${{ secrets.CONTROL_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          CLIPSHORTENER_FFMPEG_THREADS: "0"
          CLIPSHORTENER_FILTER_THREADS: "4"
          CLIPSHORTENER_FFMPEG_PRESET: "ultrafast"
          CLIPSHORTENER_FFMPEG_TUNE: ""
          CLIPSHORTENER_X264_PARAMS: ""
          CLIPSHORTENER_UPLOAD_FSYNC: "0"
          CLIPSHORTENER_NO_UPSCALE: "1"
          CLIPSHORTENER_VALIDATE_OUTPUT_DURATIONS: "1"
        run: python process_job.py
